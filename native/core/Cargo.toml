[package]
name = "fluentcal-core"
description = "FluentCal：数据、同步与日历逻辑（不含界面）"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "fluentcal_core"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Cloud sync (src/cloud). native-tls = Windows schannel with the system certificate store;
# rustls would need ring, which needs a C compiler and assembler.
ureq = { version = "3.5.0", default-features = false, features = ["native-tls-no-default", "gzip", "win-system-proxy"] }
base64 = "0.23.1"
getrandom = "0.3.4"
# Web view (src/web.rs): a small HTTP/1.1 server without TLS for the local network.
tiny_http = "0.12.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_SystemInformation",
] }
