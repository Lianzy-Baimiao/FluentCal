[package]
name = "fluentcal-native"
description = "FluentCal 桌面日历：Rust 原生界面"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "fluentcal_app"
path = "src/lib.rs"

[[bin]]
name = "fluentcal"
path = "src/main.rs"

[dependencies]
fluentcal-core = { path = "../core" }
getrandom = "0.3.4"
raw-window-handle = "0.6"
# Gantt PNG export: rasterises the exported SVG (as 0.2 drew it on a canvas).
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Software renderer only (4.6 MB idle; femtovg/OpenGL costs about 96 MB, 需求文档 7.7).
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit",
    "renderer-software",
    "accessibility",
    "unstable-winit-030",
    "unstable-fontique-011",
] }
png = "0.18.1"
tauri-winrt-notification = "0.8.1"
windows = { version = "0.62.2", features = [
    "Foundation",
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-version = "0.1.7"

[dev-dependencies]
# Native end-to-end tests (tests/e2e.rs): Slint's headless testing backend.
i-slint-backend-testing = "=1.18.1"

[build-dependencies]
slint-build = "1.18.1"
