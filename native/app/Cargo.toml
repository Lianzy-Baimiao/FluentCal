[package]
name = "fluentcal-native"
description = "FluentCal 桌面日历：Rust 原生界面"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "fluentcal"
path = "src/main.rs"

[dependencies]
fluentcal-core = { path = "../core" }
raw-window-handle = "0.6"
serde_json = "1.0.154"
slint = { version = "1.18.1", features = ["unstable-winit-030"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
