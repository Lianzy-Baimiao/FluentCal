[package]
name = "fluentcal-native"
description = "FluentCal 桌面日历：Rust 原生界面"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "fluentcal_app"
path = "src/lib.rs"

[[bin]]
name = "fluentcal"
path = "src/main.rs"

[dependencies]
fluentcal-core = { path = "../core" }
raw-window-handle = "0.6"
serde_json = "1.0.154"
# Software renderer only (4.6 MB idle; femtovg/OpenGL costs about 96 MB, 需求文档 7.7).
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit",
    "renderer-software",
    "accessibility",
    "unstable-winit-030",
    "unstable-fontique-011",
] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
png = "0.18.1"

[build-dependencies]
slint-build = "1.18.1"
