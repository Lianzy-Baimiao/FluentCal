# FluentCal, Rust native (需求文档 7.7): `core` holds the data, sync and calendar logic (no UI,
# tested on its own); `app` is the Slint user interface and the Windows integration.
[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
version = "0.3.9"
edition = "2021"
publish = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# The software renderer with glyph contrast/hinting closer to DirectWrite, and winit 0.30.13 with
# the mixed-DPI drag fix from 0.31 (see vendor/README.md).
[patch.crates-io]
i-slint-renderer-software = { path = "vendor/i-slint-renderer-software" }
winit = { path = "vendor/winit" }
